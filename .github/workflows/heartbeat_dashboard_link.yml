# مسیر واقعی: .github/workflows/heartbeat_dashboard_link.yml
# FIX2: قرارگرفتن در همان صف نویسندهٔ مشترک. این فایل از قبل git add -A
# و retry دارد؛ تنها تغییر عملی این نسخه concurrency است.

name: WeatherBet - بروزرسانی و یادآوری ۶ساعتهٔ داشبورد تعاملی

on:
  schedule:
    - cron: "30 6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install -r requirements.txt

      - name: اسکن سبک -- تازه‌سازی قیمت/پیش‌بینی + resolve + کالیبراسیون (بدون سایزینگ)
        run: python weatherbot_v3.py lite_scan

      - name: ساخت دوبارهٔ داشبورد تعاملی با آخرین داده‌های موجود
        run: python dashboard_simple.py

      - name: کپی فایل‌ها به پوشه‌ی انتشار
        run: |
          mkdir -p docs
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"

      - name: کامیت و انتشار امن
        run: |
          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "بروزرسانی ۶ساعتهٔ داشبورد تعاملی" || echo "چیزی برای کامیت نبود"

          PUSHED=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              PUSHED=true
              break
            fi
            echo "تلاش $i برای push ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::انتشار تغییرات بعد از ۵ تلاش ناموفق بود."
            exit 1
          fi

      - name: ارسال لینک داشبورد تعاملی در تلگرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          link = "https://ericlamar008.github.io/weatherbot/simple.html"
          text = f"\U0001F504 بروزرسانی ۶ساعته -- داشبورد تعاملی تازه‌سازی شد:\n{link}"
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat, "text": text},
                  timeout=15,
              )
          else:
              print("توکن یا چت آیدی تلگرام تنظیم نشده:", text)
          PY
