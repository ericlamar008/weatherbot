# مسیر واقعی: .github/workflows/heartbeat_dashboard_link.yml
#
# PATCH (این نسخه): اضافه‌شدن بند concurrency که در سه Workflow نوشتاری
# دیگر (monitor_locks.yml، scan_daily.yml، process_lock_events.yml) از قبل
# وجود داشت اما در این فایل هرگز اضافه نشده بود. نبود آن باعث می‌شد اگر
# این Workflow دقیقاً هم‌زمان با یکی از آن سه اجرا شود (مثلاً هر دو با
# فاصلهٔ چند ثانیه از cron-job.org یا تست دستی)، هر دو هم‌زمان روی
# simple.html / docs/simple.html بنویسند و در rebase به‌هم بخورند --
# دقیقاً همان CONFLICT و اجراهای طولانی/ناموفقی که مشاهده شد.

# بقیهٔ منطق (اسکن سبک، انتشار نسخهٔ یکتا، پاک‌سازی نسخه‌های قدیمی، ارسال
# لینک در تلگرام) نسبت به نسخهٔ قبلی تغییری نکرده است.

name: WeatherBet - بروزرسانی و یادآوری ۶ساعتهٔ داشبورد تعاملی

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install -r requirements.txt

      - name: اجرای اسکن سبک (تازه‌سازی قیمت/پیش‌بینی، بدون سایزینگ)
        run: python weatherbot_v3.py lite_scan

      - name: ساخت دوبارهٔ داشبورد تعاملی با آخرین داده‌های موجود
        run: python dashboard_simple.py

      - name: انتشار نسخهٔ یکتای داشبورد و پاک‌سازی نسخه‌های قدیمی
        run: |
          mkdir -p docs
          DASHBOARD_FILE="simple-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.html"
          cp simple.html "docs/${DASHBOARD_FILE}"
          # مسیر ثابت فقط برای bookmarkهای قدیمی باقی می‌ماند؛ لینک تلگرام
          # به نسخهٔ یکتا اشاره می‌کند تا کش نتواند خروجی قبلی را برگرداند.
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"
          echo "DASHBOARD_FILE=${DASHBOARD_FILE}" >> "$GITHUB_ENV"

          # فقط فایل‌های نسخه‌ای simple-*.html را مرتب کن و فقط ۲۰ فایل تازه
          # را نگه‌دار. این دستور هرگز docs/simple.html، dashboard.html، CSV
          # یا هیچ فایل/دایرکتوری داخل data/ را حذف نمی‌کند.
          mapfile -t OLD_DASHBOARDS < <(ls -1t docs/simple-*.html 2>/dev/null | tail -n +21 || true)
          if [ "${#OLD_DASHBOARDS[@]}" -gt 0 ]; then
            printf 'حذف نسخه‌های قدیمی داشبورد:\n%s\n' "${OLD_DASHBOARDS[@]}"
            rm -- "${OLD_DASHBOARDS[@]}"
          fi

      - name: کامیت و انتشار (با ایمنی در برابر برخورد هم‌زمان)
        run: |
          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "اسکن سبک ۶ساعته + بروزرسانی داشبورد تعاملی" || echo "چیزی برای کامیت نبود"

          PUSHED=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              PUSHED=true
              break
            fi
            echo "تلاش $i برای push ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::انتشار تغییرات بعد از ۵ تلاش ناموفق بود."
            exit 1
          fi

      - name: ارسال لینک نسخه‌ای داشبورد در تلگرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_FILE: ${{ env.DASHBOARD_FILE }}
        run: |
          python3 - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          dashboard_file = os.environ["DASHBOARD_FILE"]
          link = f"https://ericlamar008.github.io/weatherbot/{dashboard_file}"
          text = f"\U0001F504 بروزرسانی ۶ساعته -- داشبورد تعاملی تازه‌سازی شد:\n{link}"
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat, "text": text},
                  timeout=15,
              )
          else:
              print("توکن یا چت آیدی تلگرام تنظیم نشده:", text)
          PY
