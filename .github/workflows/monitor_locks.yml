# مسیر واقعی: .github/workflows/monitor_locks.yml
# FIX2: رفع قطعی خطای «cannot pull with rebase: You have unstaged changes»
# - git add -A تمام خروجی‌های تولیدشده (از جمله simple.html ریشه) را stage می‌کند.
# - concurrency تمام workflowهای نویسنده را در یک صف قرار می‌دهد تا هم‌زمان
#   locked_signals.json/docs را بازنویسی نکنند.
# - اگر هر پنج تلاش push ناموفق باشد، job واقعاً با exit 1 شکست می‌خورد؛
#   پس دیگر تیک سبز کاذب دیده نمی‌شود.

name: WeatherBet - اسکن نیم‌ساعتهٔ قفل‌ها

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install requests

      - name: بررسی قفل‌ها، بستن قفل‌های resolve‌شده، ارسال تلگرام در صورت نیاز
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_monitor.py

      - name: بازسازی داشبورد ساده با وضعیت تازه
        run: python dashboard_simple.py

      - name: انتشار داشبورد ساده و CSV در GitHub Pages
        run: |
          mkdir -p docs
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"

          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "بروزرسانی اسکن نیم‌ساعتهٔ قفل‌ها" || echo "چیزی برای کامیت نبود"

          PUSHED=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              PUSHED=true
              break
            fi
            echo "تلاش $i برای push ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::انتشار تغییرات بعد از ۵ تلاش ناموفق بود."
            exit 1
          fi
