# مسیر واقعی: .github/workflows/monitor_locks.yml
#
# PATCH این نسخه (رفع خطای واقعی "unresolved conflict" روی
# data/markets/*.json و simple.html که باعث شد این Workflow از حدود ۵ ساعت
# پیش دیگر با موفقیت کامل نشود) -----------------------------------------------
#
# ریشهٔ اصلی خطا: دقیقاً همون الگوی مشکل‌داری که در process_lock_events.yml
# پیدا و رفع کردیم -- این Workflow یک‌بار simple.html/data/markets/*.json را
# می‌ساخت، یک کامیت می‌ساخت، و فقط تلاش می‌کرد اون یک کامیت رو با
# git pull --rebase روی آخرین نسخهٔ ریموت اعمال کنه. چون هم simple.html
# (بازسازی کامل هر بار) و هم فایل‌های data/markets/*.json که
# weatherbot_v3.py price_refresh هر بار کامل بازنویسی می‌کند، وقتی دو اجرای
# پشت‌سرهم (هر ۳۰ دقیقه) با هم تداخل زمانی پیدا کنند، تقریباً حتمی است که
# rebase با "unresolved conflict" شکست بخورد.
#
# چرا این‌بار شدیدتر شد: یک اجرا (احتمالاً هم‌زمان با آپلود حجم زیادی از
# فایل‌های قدیمی data/markets/ به ریپو) کندتر از حد معمول طول کشید، دقیقاً
# با اجرای زمان‌بندی‌شدهٔ بعدی (۳۰ دقیقه بعد) تداخل پیدا کرد، و طبق تنظیم
# concurrency، گیت‌هاب اجرای قدیمی‌تر را کنسل کرد -- این باعث یک چرخهٔ
# خودتکرارشونده از conflict/کنسل‌شدن شد که از آن لحظه تا الان ادامه داشته.
#
# راه‌حل: برخلاف process_lock_events.yml، این Workflow هیچ عملیات
# یک‌بارمصرف و برگشت‌ناپذیر ندارد (هیچ GitHub Issue ای نمی‌بندد -- فقط
# قیمت‌ها را می‌خواند و داشبورد می‌سازد). پس کاملاً امن است که *کل* مراحل
# (price_monitor.py + price_refresh + dashboard_simple.py + انتشار) داخل
# یک حلقهٔ retry قرار بگیرند که هر تلاش، اول با git fetch + git reset --hard
# دقیقاً روی آخرین نسخهٔ واقعی ریموت می‌ایستد و سپس همه‌چیز را از صفر روی
# همان نسخه بازسازی می‌کند -- هیچ‌وقت یک کامیت قدیمی روی تاریخچهٔ جدید
# rebase نمی‌شود، پس تناقض متنی اصلاً رخ نمی‌دهد.
#
# منطق داخلی price_monitor.py، weatherbot_v3.py، و dashboard_simple.py
# هیچ‌کدام تغییر نکرده‌اند -- فقط نحوهٔ فراخوانی/کامیت آن‌ها در این فایل
# YAML بازطراحی شده است.

name: WeatherBet - اسکن نیم‌ساعتهٔ قفل‌ها

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install -r requirements.txt

      - name: اجرای اسکن سبک (قیمت/پیش‌بینی، بدون سایزینگ) و انتشار امن (با بازسازی کامل از روی آخرین نسخه در هر تلاش)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"

          PUSHED=false
          DASHBOARD_FILE=""

          for i in 1 2 3 4 5; do
            echo "=== تلاش $i ==="

            # همیشه دقیقاً روی آخرین نسخهٔ واقعی ریموت می‌ایستیم -- نه rebase
            # یک کامیت قدیمی، بلکه شروع تازه از جدیدترین تاریخچه. این
            # Workflow هیچ عملیات برگشت‌ناپذیری (مثل بستن Issue) ندارد، پس
            # این کار کاملاً بی‌خطر است.
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"

            python price_monitor.py
            python weatherbot_v3.py price_refresh
            python dashboard_simple.py

            mkdir -p docs
            DASHBOARD_FILE="simple-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}.html"
            cp simple.html "docs/${DASHBOARD_FILE}"
            cp simple.html docs/simple.html
            cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"

            mapfile -t OLD_DASHBOARDS < <(ls -1t docs/simple-*.html 2>/dev/null | tail -n +61 || true)
            if [ "${#OLD_DASHBOARDS[@]}" -gt 0 ]; then
              printf 'حذف نسخه‌های قدیمی داشبورد:\n%s\n' "${OLD_DASHBOARDS[@]}"
              rm -- "${OLD_DASHBOARDS[@]}"
            fi

            git add -A

            if git diff --cached --quiet; then
              echo "چیزی برای کامیت نبود -- احتمالاً یک اجرای دیگر همین لحظه را قبلاً پردازش کرده."
              PUSHED=true
              break
            fi

            git commit -m "بروزرسانی اسکن نیم‌ساعتهٔ قفل‌ها"

            if git push; then
              PUSHED=true
              break
            fi

            echo "push در تلاش $i ناموفق بود (احتمالاً یک اجرای دیگر هم‌زمان push زد) -- ۵ ثانیه صبر و تلاش دوباره از روی آخرین نسخه..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::انتشار تغییرات بعد از ۵ تلاش ناموفق بود."
            exit 1
          fi

          echo "DASHBOARD_FILE=${DASHBOARD_FILE}" >> "$GITHUB_ENV"

      - name: انتظار برای انتشار واقعی نسخهٔ یکتا در GitHub Pages
        run: |
          URL="https://ericlamar008.github.io/weatherbot/${{ env.DASHBOARD_FILE }}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "منتشر شد: $URL"
              exit 0
            fi
            echo "هنوز منتشر نشده (کد $CODE) -- تلاش $i از ۳۰، ۱۰ ثانیه صبر..."
            sleep 10
          done
          echo "::error::نسخهٔ یکتا تا ۵ دقیقه منتشر نشد -- لینک ۴۰۴ به تلگرام فرستاده نمی‌شود."
          exit 1

      - name: ارسال یک پیام واحد (وضعیت + لینک تازه) -- همیشه
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_FILE: ${{ env.DASHBOARD_FILE }}
        run: |
          python3 - <<'PY'
          import os, requests
          from pathlib import Path
          from datetime import datetime, timezone

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          dashboard_file = os.environ["DASHBOARD_FILE"]
          link = f"https://ericlamar008.github.io/weatherbot/{dashboard_file}"

          status_file = Path("data/last_price_status.txt")
          if status_file.exists():
              body = status_file.read_text(encoding="utf-8")
          else:
              now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")
              body = f"\U0001F4CA \u0648\u0636\u0639\u06CC\u062A \u0642\u0641\u0644\u200C\u0647\u0627 \u2014 {now_str} UTC\n\n\u0647\u06CC\u0686 \u0642\u0641\u0644 \u0628\u0627\u0632 \u0641\u0639\u0627\u0644\u06CC \u0648\u062C\u0648\u062F \u0646\u062F\u0627\u0631\u062F."

          text = body + f"\n\n\U0001F517 \u062F\u0627\u0634\u0628\u0648\u0631\u062F \u0628\u0647-\u0631\u0648\u0632:\n{link}"

          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat,
                      "text": text,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True,
                  },
                  timeout=15,
              )
          else:
              print("توکن یا چت آیدی تلگرام تنظیم نشده:", text)
          PY
