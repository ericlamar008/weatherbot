# مسیر واقعی: .github/workflows/scan_daily.yml
#
# PATCH نهایی: کرون داخلی گیت‌هاب (schedule) حذف شد چون زمان‌بندی این
# Workflow از این به بعد کاملاً بر عهدهٔ زمان‌بند خارجی (cron-job.org) است
# که هر روز یک بار (ساعت ۰۲:۲۰ به‌وقت UTC) با فراخوانی workflow_dispatch
# این Workflow را اجرا می‌کند. اگر کرون داخلی همزمان فعال می‌ماند، این
# Workflow دوبار در بازه‌های نزدیک به هم اجرا می‌شد.
#
# بقیهٔ منطق (اسکن کامل با سایزینگ، انتشار امن، dead man's switch) نسبت
# به نسخهٔ قبلی تغییری نکرده است.

name: WeatherBet - اسکن روزانه

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install -r requirements.txt

      - name: اجرای یک دور کامل ربات
        run: python weatherbot_v3.py once

      - name: ساخت داشبورد سادهٔ تعاملی
        run: python dashboard_simple.py

      - name: انتشار هر دو داشبورد در GitHub Pages
        run: |
          mkdir -p docs
          DASHBOARD_FILE="simple-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.html"
          cp dashboard.html docs/dashboard.html
          cp simple.html "docs/${DASHBOARD_FILE}"
          # مسیر ثابت برای bookmarkهای قدیمی نگه داشته می‌شود؛ لینک تلگرام
          # فقط به نسخهٔ یکتای بالا اشاره خواهد کرد.
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"
          echo "DASHBOARD_FILE=${DASHBOARD_FILE}" >> "$GITHUB_ENV"

          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "بروزرسانی خودکار روزانه" || echo "چیزی برای کامیت نبود"

          PUSHED=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              PUSHED=true
              break
            fi
            echo "تلاش $i برای push ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::انتشار تغییرات بعد از ۵ تلاش ناموفق بود."
            exit 1
          fi

      - name: بررسی سلامت اسکن نیم‌ساعتهٔ قفل‌ها (dead man's switch)
        id: deadman
        run: |
          LAST_TS=$(git log -1 --format=%ct -- data/locked_signals.json 2>/dev/null || echo 0)
          NOW_TS=$(date +%s)
          DIFF_H=$(( (NOW_TS - LAST_TS) / 3600 ))
          echo "hours_since_last_lock_update=$DIFF_H" >> "$GITHUB_OUTPUT"
          if [ "$LAST_TS" = "0" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          elif [ "$DIFF_H" -ge 4 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ارسال لینک هر دو داشبورد در تلگرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_FILE: ${{ env.DASHBOARD_FILE }}
          DEADMAN_STALE: ${{ steps.deadman.outputs.stale }}
          DEADMAN_HOURS: ${{ steps.deadman.outputs.hours_since_last_lock_update }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          base = "https://ericlamar008.github.io/weatherbot"
          stale = os.environ.get("DEADMAN_STALE", "false") == "true"
          hours_since = os.environ.get("DEADMAN_HOURS", "?")
          warning = (
              f"\n\n⚠️ هشدار: اسکن نیم‌ساعتهٔ قفل‌ها حدود {hours_since} ساعت است commit تازه نداشته -- "
              f"احتمالاً monitor_locks.yml اجرا نشده."
          ) if stale else ""
          text = (
              "داشبوردهای امروز آماده‌اند:\n"
              f"داشبورد کامل: {base}/dashboard.html\n"
              f"داشبورد ساده (قفل تعاملی): {base}/{os.environ.get('DASHBOARD_FILE', 'simple.html')}"
              f"{warning}"
          )
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat, "text": text},
                  timeout=15,
              )
          else:
              print("توکن یا چت آیدی تلگرام تنظیم نشده:", text)
          PY
