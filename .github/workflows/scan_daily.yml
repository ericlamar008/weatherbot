# محل قرارگیری: .github/workflows/scan_daily.yml (نسخهٔ نهایی)

name: WeatherBet - اسکن روزانه

on:
  schedule:
    - cron: "30 0 * * *"   # هر روز ساعت 00:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install -r requirements.txt

      - name: اجرای یک دور کامل ربات (همان رفتار همیشگی)
        run: python weatherbot_v3.py once

      - name: ساخت داشبورد سادهٔ تعاملی
        run: python dashboard_simple.py

      - name: انتشار هر دو داشبورد در GitHub Pages
        run: |
          mkdir -p docs
          cp dashboard.html docs/dashboard.html
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"
          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          git add docs data
          git commit -m "بروزرسانی خودکار روزانه" || echo "چیزی برای کامیت نبود"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

      - name: ارسال لینک هر دو داشبورد در تلگرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          base = "https://ericlamar008.github.io/weatherbot"  # این خط را با آدرس واقعی خودتان جایگزین کنید
          text = (
              "داشبوردهای امروز آماده‌اند:\n"
              f"داشبورد کامل: {base}/dashboard.html\n"
              f"داشبورد ساده (قفل تعاملی): {base}/simple.html"
          )
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat, "text": text},
                  timeout=15,
              )
          else:
              print("توکن یا چت آیدی تلگرام تنظیم نشده:", text)
          PY
