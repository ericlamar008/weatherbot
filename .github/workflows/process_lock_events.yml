# مسیر واقعی: .github/workflows/process_lock_events.yml
#
# نسخهٔ نهایی برای این مرحله:
# - workflow_dispatch اضافه شده تا دکمهٔ «Run workflow» در تب Actions باشد
#   (برای پردازش دستیِ issueهای قدیمیِ گیرکرده یا تست).
# - بر خلاف تلاش قبلی، اینجا دیگر بعد از هر قفل/حذف‌قفل، یک لینک یکتا
#   ساخته و در تلگرام فرستاده نمی‌شود -- چون وقتی چند شهر پشت‌سرهم قفل شوند
#   (هر issue = یک اجرای جدا)، همان تعداد پیام/لینک جداگانه در تلگرام
#   ایجاد می‌شد. به‌جای آن، هر بار فقط مسیر ثابت docs/simple.html به‌روز
#   می‌شود؛ کاربر همیشه از همان یک آدرس ثابت (با یک رفرش سخت) آخرین وضعیت
#   قفل‌ها را می‌بیند. لینک‌های یکتا و پیام تلگرام همچنان فقط در
#   scan_daily.yml و heartbeat_dashboard_link.yml (اسکن‌های زمان‌بندی‌شده)
#   باقی می‌مانند.
#
# منطق lock_manager.py، دستور اجرای آن، concurrency و retry پوش نسبت به
# نسخهٔ قبلی تغییری نکرده است.

name: WeatherBet - پردازش فوری قفل و حذف قفل

on:
  issues:
    types: [opened]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install requests

      - name: پردازش قفل‌ها و حذف‌قفل‌های تازه + ساخت CSV تاریخچه
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python lock_manager.py

      - name: بازسازی داشبورد ساده با وضعیت تازه
        run: python dashboard_simple.py

      - name: انتشار داشبورد ساده و CSV در GitHub Pages (فقط مسیر ثابت)
        run: |
          mkdir -p docs
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"

          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "بروزرسانی قفل‌ها" || echo "چیزی برای کامیت نبود"

          PUSHED=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              PUSHED=true
              break
            fi
            echo "تلاش $i برای push ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::انتشار تغییرات بعد از ۵ تلاش ناموفق بود."
            exit 1
          fi
