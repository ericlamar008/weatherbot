# مسیر واقعی: .github/workflows/process_lock_events.yml

# نسخهٔ نهایی برای این مرحله:
# - workflow_dispatch اضافه شده تا دکمهٔ «Run workflow» در تب Actions باشد
# (برای پردازش دستیِ issueهای قدیمیِ گیرکرده یا تست).
# - بر خلاف تلاش قبلی، اینجا دیگر بعد از هر قفل/حذف‌قفل، یک لینک یکتا
# ساخته و در تلگرام فرستاده نمی‌شود -- چون وقتی چند شهر پشت‌سرهم قفل شوند
# (هر issue = یک اجرای جدا)، همان تعداد پیام/لینک جداگانه در تلگرام
# ایجاد می‌شد. لینک‌های یکتا و پیام تلگرام همچنان فقط در scan_daily.yml،
# heartbeat_dashboard_link.yml و monitor_locks.yml (اسکن‌های زمان‌بندی‌شده)
# باقی می‌مانند.

# --- PATCH این نسخه (رفع خطای واقعی "unresolved conflict" هنگام چند قفل
# پشت‌سرهم، مثال واقعی: UNLOCK Munich #113، LOCK Austin #121) -----------------
# ریشهٔ اصلی خطا: هر کلیک روی "قفل کن"/"حذف قفل" یک Issue جدید و جدا باز
# می‌کند، و هر Issue یک اجرای کاملاً مستقل از این Workflow راه می‌اندازد. اگر
# چند کلیک پشت‌سرهم بزنید، چند اجرا پشت‌سرهم صف می‌کشند. چون dashboard_simple.py
# کل simple.html را هر بار از صفر بازسازی می‌کند (با ساعت/شمارش معکوسی که هر
# لحظه فرق دارد)، وقتی اجرای دوم می‌خواهد نسخهٔ خودش را با نسخه‌ای که اجرای
# اول همین چند ثانیه پیش push کرده "rebase" کند، تقریباً کل فایل متفاوت است و
# گیت نمی‌تواند خودکار ادغامش کند -- rebase با "unresolved conflict" شکست
# می‌خورد و بعد از ۵ تلاش، کل Job با خطا متوقف می‌شود.
#
# به درخواست کاربر: چون کاربر خودش مستقیم از simple.html استفاده نمی‌کند و
# فقط به لینک‌هایی که هر ۳۰ دقیقه از monitor_locks.yml در تلگرام می‌آید
# متکی است، این Workflow دیگر اصلاً داشبورد نمی‌سازد و docs/ را لمس نمی‌کند --
# نه فقط راه‌حل rebase-ایمن، بلکه حذف کامل منبع خطا. این Workflow از این به
# بعد فقط یک کار می‌کند: پردازش قفل/حذف‌قفل و ثبت امن نتیجه در
# data/locked_signals.json + data/lock_history.csv (با git add دقیق فقط
# روی همین دو فایل، نه git add -A). حداکثر تا ۳۰ دقیقه طول می‌کشد تا یک
# قفل/حذف‌قفل تازه در simple.html/لینک تلگرام منعکس شود (توسط
# monitor_locks.yml) -- که چون کاربر مستقیم از آن داشبورد استفاده نمی‌کند،
# تأثیری در تجربهٔ او ندارد.
#
# منطق lock_manager.py، دستور اجرای آن، env varها، concurrency، permissions،
# و trigger های on: (هم issues هم workflow_dispatch) نسبت به نسخهٔ واقعیِ
# فعلی این فایل هیچ تغییری نکرده‌اند.

name: WeatherBet - پردازش فوری قفل و حذف قفل

on:
  issues:
    types: [opened]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install requests

      - name: پردازش قفل‌ها و حذف‌قفل‌های تازه + ساخت CSV تاریخچه
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python lock_manager.py

      - name: ثبت امن داده‌های قفل (بدون ساخت یا انتشار داشبورد -- آن کار برعهدهٔ monitor_locks.yml هر ۳۰ دقیقه است)
        run: |
          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"

          git add data/locked_signals.json data/lock_history.csv

          if git diff --cached --quiet; then
            echo "تغییری در داده‌های قفل نبود -- چیزی برای کامیت نیست."
            exit 0
          fi

          git commit -m "بروزرسانی قفل‌ها"

          PUSHED=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              PUSHED=true
              break
            fi
            echo "تلاش $i برای push داده‌های قفل ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::داده‌های قفل بعد از ۵ تلاش push نشد. لطفاً به‌صورت دستی بررسی کنید (این حالت باید بسیار نادر باشد چون این فایل‌ها کوچک‌اند و این Workflow دیگر داشبورد نمی‌سازد)."
            exit 1
          fi
