# محل قرارگیری واقعی: .github/workflows/process_lock_events.yml

name: WeatherBet - پردازش فوری قفل و حذف قفل

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب پیش‌نیازها
        run: pip install requests

      - name: پردازش قفل‌ها و حذف‌قفل‌های تازه + ساخت CSV تاریخچه
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python lock_manager.py

      - name: بازسازی داشبورد ساده با وضعیت تازه
        run: python dashboard_simple.py

      - name: انتشار داشبورد ساده و CSV در GitHub Pages
        run: |
          mkdir -p docs
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"
          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          git add docs data/locked_signals.json data/lock_history.csv
          git commit -m "بروزرسانی قفل‌ها" || echo "چیزی برای کامیت نبود"
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push && break
            echo "تلاش $i برای push ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done
